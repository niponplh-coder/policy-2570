<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b2550"><title>มอบนโยบายบริหารราชการ | ตำรวจภูธรภาค 3</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans Thai",Tahoma,sans-serif;color:#12345a;background:#edf3fa}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(120deg,#08234c,#11457b);color:#fff;text-align:center;padding:20px 16px 14px;border-bottom:4px solid #cba348}header .eyebrow{font-size:12px;letter-spacing:.5px;color:#f5d894}h1{font-size:clamp(20px,4.6vw,30px);margin:6px 0;font-weight:750}header p{font-size:13px;margin:0;opacity:.85}.toolbar{position:sticky;top:0;z-index:5;display:flex;justify-content:center;align-items:center;gap:9px;flex-wrap:wrap;padding:10px 8px;background:#fff;box-shadow:0 2px 10px #0c345018}button,select{font:inherit;border:1px solid #b7c7d8;background:#fff;border-radius:10px;padding:9px 12px;color:#133c70;cursor:pointer;font-weight:650}button:disabled{opacity:.4;cursor:default}.count{font-size:13px;min-width:92px;text-align:center}main{max-width:1140px;margin:18px auto 30px;padding:0 10px}.page{background:#fff;border-radius:12px;padding:6px;margin:0 auto 17px;box-shadow:0 6px 25px #0d37651c;scroll-margin-top:85px}.page img{display:block;width:100%;height:auto;aspect-ratio:16/9;object-fit:contain;background:#f1f5f9;border-radius:6px}.page figcaption{text-align:center;font-size:12px;color:#6b7b90;padding:7px}.hint{text-align:center;font-size:12px;color:#59738d;margin:14px}footer{text-align:center;color:#6b7b90;font-size:11px;padding:15px}#floatTop{position:fixed;bottom:18px;right:18px;background:#0d3f78;color:#fff;border:0;border-radius:50%;width:46px;height:46px;box-shadow:0 4px 17px #143f7055}@media(min-width:900px){main{max-width:950px}}@media(max-width:420px){.toolbar{gap:5px}button,select{padding:8px;font-size:13px}}
</style></head><body>
<header><div class="eyebrow">ตำรวจภูธรภาค 3</div><h1>มอบนโยบายบริหารราชการ</h1><p>ประจำปีงบประมาณ พ.ศ. 2570 · เอกสาร 37 หน้า</p></header>
<nav class="toolbar" aria-label="เครื่องมืออ่านเอกสาร"><button id="prev" type="button">‹ ก่อนหน้า</button><span id="count" class="count">หน้า 1 / 37</span><button id="next" type="button">ถัดไป ›</button><select id="jump" aria-label="เลือกหน้าที่ต้องการอ่าน"></select></nav>
<div class="hint">เลื่อนลงเพื่ออ่านต่อ · แตะภาพค้างหรือขยายด้วยนิ้วตามความสามารถของเบราว์เซอร์</div>
<main id="pages"></main><button id="floatTop" type="button" aria-label="กลับด้านบน">↑</button><footer>เอกสารเผยแพร่สำหรับอ่านบนเว็บไซต์ · ตำรวจภูธรภาค 3</footer>
<script>
const N=37, list=document.querySelector('#pages'),jump=document.querySelector('#jump'),label=document.querySelector('#count');let active=1;
for(let i=1;i<=N;i++){let opt=document.createElement('option');opt.value=i;opt.textContent='หน้า '+i;jump.appendChild(opt);let fig=document.createElement('figure');fig.className='page';fig.id='page-'+i;let img=document.createElement('img');img.src='page-'+String(i).padStart(2,'0')+'.webp';img.alt='ภาพเอกสารหน้า '+i+' จาก 37 หน้า';img.loading=i<=2?'eager':'lazy';img.decoding='async';let cap=document.createElement('figcaption');cap.textContent='หน้า '+i+' / '+N;fig.append(img,cap);list.append(fig)}
function goto(n){n=Math.max(1,Math.min(N,n));document.getElementById('page-'+n).scrollIntoView({behavior:'smooth',block:'start'});update(n)}function update(n){active=n;label.textContent='หน้า '+n+' / '+N;jump.value=n;document.getElementById('prev').disabled=n===1;document.getElementById('next').disabled=n===N}
document.querySelector('#prev').onclick=()=>goto(active-1);document.querySelector('#next').onclick=()=>goto(active+1);jump.onchange=e=>goto(Number(e.target.value));document.querySelector('#floatTop').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
if('IntersectionObserver' in window){let watcher=new IntersectionObserver(es=>{let visible=es.filter(x=>x.isIntersecting).sort((a,b)=>b.intersectionRatio-a.intersectionRatio);if(visible.length)update(Number(visible[0].target.id.split('-')[1]))},{rootMargin:'-80px 0px -35% 0px',threshold:[0,.1,.3,.5]});document.querySelectorAll('.page').forEach(x=>watcher.observe(x))}
update(1);
</script></body></html>
